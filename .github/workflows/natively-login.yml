# NativelyAI fork: builds our login app (apps/login) and pushes the image to the auth GCP
# project's Artifact Registry, where Natively-Auth's Cloud Run service `zitadel-login` pulls it.
#
# Runs on pushes to natively/<zitadel version> branches (e.g. natively/v4.19.5). The image tag
# carries that Zitadel version, so login and core versions stay matched:
#   <location>-docker.pkg.dev/<project>/<repository>/zitadel-login-natively:v4.19.5-<short sha>
#
# Auth is Workload Identity Federation: no service account key lives in this (public) repo.
# Repository variables to set (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID                  auth GCP project id
#   GAR_LOCATION                    Artifact Registry location, e.g. europe-west1
#   GAR_REPOSITORY                  Artifact Registry repository Natively-Auth mirrors images into
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             service account with roles/artifactregistry.writer on that repository

name: Natively login image

on:
  push:
    branches:
      - "natively/v*"
    paths:
      - "apps/login/**"
      - "packages/**"
      - "proto/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/natively-login.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the image tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#natively/}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch must be natively/vX.Y.Z (got $BRANCH)"
            exit 1
          fi
          image="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/zitadel-login-natively"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm nx run --nxBail @zitadel/login:test-unit

      - name: Build login standalone
        run: pnpm nx run --nxBail @zitadel/login:build

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: linux/amd64 # Cloud Run
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=natively-login
          cache-to: type=gha,mode=max,scope=natively-login

      - name: Summary
        run: |
          {
            echo "### Login image pushed"
            echo
            echo '```'
            echo "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}"
            echo '```'
            echo "Set \`login_image\` in Natively-Auth \`infra/modules/zitadel-env/locals.tf\` to this, plus \`EMAIL_CODE_LOGIN=true\` in \`login_env\`."
          } >> "$GITHUB_STEP_SUMMARY"
